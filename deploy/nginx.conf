# Install in /etc/nginx/sites-available/yellostack; included inside nginx's http context.
limit_req_zone $binary_remote_addr zone=ys_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ys_enquiries:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yellostack.com www.yellostack.com;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;

    # Certbot adds HTTPS and redirects after DNS is verified.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /api/cms/login {
        limit_req zone=ys_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/enquiries {
        limit_req zone=ys_enquiries burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
